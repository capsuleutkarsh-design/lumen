# Every push: flutter analyze + flutter test on Windows.
# A tag like v0.2.0-beta: also builds lumen.exe, the installer and the portable zip
# (installer\build_installer.ps1) and drafts a pre-release with them and SHA256SUMS.txt.
# The draft is not published until the owner checks it and presses Publish on GitHub.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: flutter pub get (plugin links as junctions if symlinks are not allowed)
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE) { powershell -NoProfile -ExecutionPolicy Bypass -File tool\link_plugins.ps1; flutter pub get }
      - run: flutter analyze
      - run: flutter test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: flutter pub get (plugin links as junctions if symlinks are not allowed)
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE) { powershell -NoProfile -ExecutionPolicy Bypass -File tool\link_plugins.ps1; flutter pub get }
      - name: Build the program, the installer and the zip
        shell: powershell
        run: installer\build_installer.ps1
      - name: Draft a pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Lumen $env:GITHUB_REF_NAME (draft made by CI).`n`nSHA-256:`n``````n$(Get-Content build\installer\SHA256SUMS.txt -Raw)``````"
          gh release create $env:GITHUB_REF_NAME --draft --prerelease --title "Lumen $env:GITHUB_REF_NAME" --notes $notes `
            (Get-ChildItem build\installer\Lumen-Setup-*.exe).FullName (Get-ChildItem build\installer\Lumen-*-portable.zip).FullName build\installer\SHA256SUMS.txt
